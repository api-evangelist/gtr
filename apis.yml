name: GTR
description: GTR (Global Top Round) was a mobile game accelerator program that annually selected roughly
  ten indie mobile game studios, providing them global publishing connections, real global game-market
  and network access, mentorship, and fundraising support through a six-month accelerator program and
  the Global Top Round global mobile game conference. It was surfaced as a 500 Global portfolio company
  and added to the API Evangelist network as a stub. As of enrichment (July 2026) the company website
  globaltopround.com no longer resolves (no DNS A/NS records) and GTR appears to be defunct; it exposes
  no public API, developer platform, documentation, or SDK, so there is no API surface to enrich.
